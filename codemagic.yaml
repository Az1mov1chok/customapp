workflows:
  ios-unsigned:
    name: iOS Unsigned IPA (для AltStore/AltServer)
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate missing platform files (ios/)
        script: |
          flutter create --platforms=ios --org com.livewalls .
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install && cd ..
      - name: Build iOS via xcodebuild (no signing)
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios_build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build
      - name: Create unsigned IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios_build/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r app-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/app-unsigned.ipa
